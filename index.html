<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShatterVox Engine</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div id="loading-screen">
        <div class="telefunken-container">
            <span class="telefunken-text">LOADING WORLD</span><span class="dots-container"></span>
        </div>
        <div class="info-text">
            A fully destructible micro-voxel environment. Everything you see is built from 12cm cubes. Physics, debris, and structural integrity are calculated in real-time. Feel free to tear it down.
        </div>
    </div>
    
    <canvas id="glcanvas"></canvas>
    
    <div id="ui-layer">
        <div id="fps-counter">FPS: 0</div>
        <div id="crosshair">+</div>

        <div id="escape-menu" style="display: none;">
            <h2>Settings</h2>
            <div class="setting-row">
                <label for="toggle-ssgi">Enable SSGI</label>
                <input type="checkbox" id="toggle-ssgi" checked>
            </div>
            <div class="setting-row">
                <label for="toggle-taa">Enable TAA</label>
                <input type="checkbox" id="toggle-taa" checked>
            </div>
            <button id="resume-btn">Resume Game</button>
        </div>
        
        <div id="project-overlay">
            <button id="close-overlay">✕</button>
            <h2 id="project-title"></h2>
            <p id="project-desc"></p>
            <a id="project-link" href="#" target="_blank">Explore</a>
        </div>

        <div id="book-overlay">
            <button id="close-book">✕</button>
            <h2 id="book-title"></h2>
            <div id="book-content"></div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
