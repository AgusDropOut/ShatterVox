<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShatterVox Engine</title>
    <style>
      body { margin: 0; overflow: hidden; background: #111; }
      canvas { display: block; width: 100vw; height: 100vh; }


    #project-overlay {
        display: none; 
        position: absolute; 
        bottom: 40px; 
        left: 50%; 
        transform: translateX(-50%); 
        
  
        background: linear-gradient(135deg, rgba(30, 26, 26, 0.95) 0%, rgba(15, 12, 12, 0.98) 100%);
        border: 1px solid #4a3c2b;
        border-top: 2px solid #8b7355; 
        border-radius: 4px;
        padding: 24px; 
        width: 420px; 
        
      
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.6);
        pointer-events: all;
        backdrop-filter: blur(4px);
    }

    #project-title {
        margin: 0 0 12px 0; 
        color: #d4af37; 
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-size: 1.4rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        border-bottom: 1px solid rgba(139, 115, 85, 0.3);
        padding-bottom: 10px;
    }

    #project-desc {
        margin: 0 0 20px 0; 
        line-height: 1.5; 
        color: #c8c0b4; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 0.95rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    #project-link {
        color: #d4af37; 
        text-decoration: none; 
        background: linear-gradient(to bottom, #2a2218, #1a150f);
        border: 1px solid #5a4e3e; 
        padding: 8px 16px; 
        display: inline-block;
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 2px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    #project-link:hover {
        background: linear-gradient(to bottom, #3a2f22, #2a2218);
        border-color: #d4af37;
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    #close-overlay {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none; 
        border: none; 
        color: #665b4f; 
        font-family: sans-serif;
        font-size: 1.2rem;
        cursor: pointer;
        transition: color 0.2s ease;
        padding: 5px;
    }

    #close-overlay:hover {
        color: #b83b3b; 
    }
      
      #ui-layer {
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 100%;
          pointer-events: none; 
      }
      
      #fps-counter {
          position: absolute;
          top: 15px; 
          left: 15px;
          color: #ffffff;
          font-family: monospace;
          font-size: 20px;
          font-weight: bold;
          text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
      }
      
      #crosshair {
          position: absolute;
          top: 50%; 
          left: 50%;
          transform: translate(-50%, -50%); 
          color: rgba(255, 255, 255, 0.8);
          font-size: 30px;
          font-family: sans-serif;
          text-shadow: 1px 1px 2px black, -1px -1px 2px black;
      }

      #loading-screen {
          position: absolute;
          top: 0; left: 0;
          width: 100vw; height: 100vh;
          background-color: #050505;
          background-image: 
            linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%), 
            linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
          background-size: 100% 4px, 6px 100%;
          z-index: 9999;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          pointer-events: all;
          transition: opacity 0.8s ease-out;
          animation: crt-flicker 0.15s infinite;
      }

      .telefunken-container {
          position: relative;
          text-align: center;
      }

      .telefunken-text {
          position: relative;
          font-family: "Courier New", Courier, monospace;
          color: #f0f0f0;
          font-size: 3rem;
          font-weight: bold;
          text-shadow: 0 0 5px rgba(255,255,255,0.8), 0 0 10px rgba(255,255,255,0.5);
          text-transform: uppercase;
          letter-spacing: 8px;
          display: inline-block;
      }

      .telefunken-text::before,
      .telefunken-text::after {
          content: 'LOADING WORLD';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #050505;
          opacity: 0;
      }

      .telefunken-text::before {
          left: 3px;
          text-shadow: -2px 0 #ff0000, 2px 0 #ff00ff;
          animation: glitch-pulse-1 4s infinite linear;
      }

      .telefunken-text::after {
          left: -3px;
          text-shadow: -2px 0 #00ff00, 2px 0 #000000;
          animation: glitch-pulse-2 4s infinite linear;
      }

      .dots-container {
          display: inline-block;
          font-family: "Courier New", Courier, monospace;
          color: #f0f0f0;
          font-size: 3rem;
          font-weight: bold;
          text-shadow: 0 0 5px rgba(255,255,255,0.8);
      }

      .dots-container::after {
          content: '';
          animation: dots 1.5s steps(4, end) infinite;
      }

      .info-text {
          margin-top: 40px;
          font-family: "Courier New", Courier, monospace;
          color: #a0a0a0;
          font-size: 1.1rem;
          max-width: 600px;
          text-align: center;
          line-height: 1.6;
          text-shadow: 0 0 3px rgba(160,160,160,0.5);
          animation: text-pulse 4s infinite;
      }

      @keyframes dots {
          0% { content: ''; }
          25% { content: '.'; }
          50% { content: '..'; }
          75% { content: '...'; }
      }

      @keyframes crt-flicker {
          0% { opacity: 0.95; }
          50% { opacity: 1.0; }
          100% { opacity: 0.96; }
      }

      @keyframes text-pulse {
          0% { opacity: 0.7; }
          50% { opacity: 1.0; }
          100% { opacity: 0.7; }
      }

      @keyframes glitch-pulse-1 {
          0%, 18%, 22%, 48%, 52%, 88%, 92%, 100% {
              opacity: 0;
              transform: translate(0);
              clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
          }
          19% { opacity: 1; transform: translate(-4px, 2px); clip-path: polygon(0 20%, 100% 20%, 100% 30%, 0 30%); }
          20% { opacity: 1; transform: translate(3px, -1px); clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
          21% { opacity: 1; transform: translate(-2px, 3px); clip-path: polygon(0 10%, 100% 10%, 100% 40%, 0 40%); }

          49% { opacity: 1; transform: translate(4px, -2px); clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%); }
          50% { opacity: 1; transform: translate(-3px, 1px); clip-path: polygon(0 30%, 100% 30%, 100% 40%, 0 40%); }
          51% { opacity: 1; transform: translate(2px, -3px); clip-path: polygon(0 70%, 100% 70%, 100% 90%, 0 90%); }

          89% { opacity: 1; transform: translate(-5px, 0px); clip-path: polygon(0 15%, 100% 15%, 100% 25%, 0 25%); }
          90% { opacity: 1; transform: translate(4px, 3px); clip-path: polygon(0 65%, 100% 65%, 100% 85%, 0 85%); }
          91% { opacity: 1; transform: translate(-2px, -4px); clip-path: polygon(0 5%, 100% 5%, 100% 20%, 0 20%); }
      }

      @keyframes glitch-pulse-2 {
          0%, 18%, 22%, 48%, 52%, 88%, 92%, 100% {
              opacity: 0;
              transform: translate(0);
              clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
          }
          19% { opacity: 1; transform: translate(4px, -2px); clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
          20% { opacity: 1; transform: translate(-3px, 1px); clip-path: polygon(0 10%, 100% 10%, 100% 25%, 0 25%); }
          21% { opacity: 1; transform: translate(2px, -3px); clip-path: polygon(0 40%, 100% 40%, 100% 55%, 0 55%); }

          49% { opacity: 1; transform: translate(-4px, 2px); clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
          50% { opacity: 1; transform: translate(3px, -1px); clip-path: polygon(0 70%, 100% 70%, 100% 90%, 0 90%); }
          51% { opacity: 1; transform: translate(-2px, 3px); clip-path: polygon(0 50%, 100% 50%, 100% 65%, 0 65%); }

          89% { opacity: 1; transform: translate(5px, 0px); clip-path: polygon(0 75%, 100% 75%, 100% 95%, 0 95%); }
          90% { opacity: 1; transform: translate(-4px, -3px); clip-path: polygon(0 35%, 100% 35%, 100% 55%, 0 55%); }
          91% { opacity: 1; transform: translate(2px, 4px); clip-path: polygon(0 85%, 100% 85%, 100% 100%, 0 100%); }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
        <div class="telefunken-container">
            <span class="telefunken-text">LOADING WORLD</span><span class="dots-container"></span>
        </div>
        <div class="info-text">
            A fully destructible micro-voxel environment. Everything you see is built from 12cm cubes. Physics, debris, and structural integrity are calculated in real-time. Feel free to tear it down.
        </div>
    </div>
    
    <canvas id="glcanvas"></canvas>
    
    <div id="ui-layer">
        <div id="fps-counter">FPS: 0</div>
        <div id="crosshair">+</div>
        
        <div id="project-overlay">
            <button id="close-overlay">✕</button>
            <h2 id="project-title"></h2>
            <p id="project-desc"></p>
            <a id="project-link" href="#" target="_blank">Explore</a>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
